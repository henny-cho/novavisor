repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: nova-format
        name: clang-format
        entry: ./nova format
        language: system
        pass_filenames: false
        types_or: [c++, c]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]

  # Cross-compilation context is only available after CMake configuration.
  # Run clang-tidy with: ./nova lint
