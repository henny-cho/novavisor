name: Cache build inputs
description: Restore dependency and compiler caches for a CI lane
inputs:
  lane:
    description: CI lane used to avoid concurrent ccache saves
    required: true
  guests:
    description: Also restore the external guest image cache
    default: "false"
  firmware:
    description: Also restore the pinned Trusted Firmware-A source cache
    default: "false"
runs:
  using: composite
  steps:
    - name: Read cache pins
      id: pins
      run: |
        source scripts/tool-versions.env
        echo "firmware=${TFA_COMMIT}" >> "${GITHUB_OUTPUT}"
        echo "compiler=${ARM_GNU_VERSION}-tidy${CLANG_TIDY_VERSION}" >> "${GITHUB_OUTPUT}"
      shell: bash

    - name: Cache CPM packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: external/cache/cpm
        key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: cpm-

    - name: Cache Trusted Firmware-A source
      if: inputs.firmware == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: external/cache/firmware
        key: firmware-${{ steps.pins.outputs.firmware }}

    - name: Cache external guest images
      if: inputs.guests == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: external/cache/guests
        key: guests-${{ hashFiles('demo/*/fetch.sh', 'demo/*/novavisor.overlay', 'demo/12_zephyr/app/**') }}

    - name: Cache ccache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.compiler }}-${{ github.sha }}-${{ inputs.lane }}
        restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.compiler }}-
