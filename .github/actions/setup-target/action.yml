name: Setup target build environment
description: Restore isolated caches and bootstrap the target tools
inputs:
  guests:
    description: Also restore the external guest image cache
    default: "false"
  firmware:
    description: Also restore the pinned Trusted Firmware-A source cache
    default: "false"
  ccache-prefix:
    description: Namespace for the ccache cache key
    default: "ccache"
runs:
  using: composite
  steps:
    - name: Cache CPM packages
      uses: actions/cache@v6
      with:
        path: external/cache/cpm
        key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: cpm-

    - name: Cache Trusted Firmware-A source
      if: inputs.firmware == 'true'
      uses: actions/cache@v6
      with:
        path: external/cache/firmware
        key: firmware-${{ hashFiles('scripts/tool-versions.env') }}

    - name: Cache ARM toolchain
      uses: actions/cache@v6
      with:
        path: .toolchain
        key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tool-versions.env') }}

    - name: Cache external guest images
      if: inputs.guests == 'true'
      uses: actions/cache@v6
      with:
        path: external/cache/guests
        key: guests-${{ hashFiles('demo/*/fetch.sh', 'demo/*/novavisor.overlay', 'demo/12_zephyr/app/**') }}

    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ${{ inputs.ccache-prefix }}-${{ github.sha }}
        restore-keys: ${{ inputs.ccache-prefix }}-

    - name: Bootstrap target tools
      run: ./scripts/bootstrap --ci
      shell: bash
