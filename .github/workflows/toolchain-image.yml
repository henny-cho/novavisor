name: Toolchain Image

on:
  push:
    branches: ["main"]
    paths:
      - containers/toolchain/Dockerfile
      - scripts/bootstrap
      - scripts/tool-versions.env
      - .github/workflows/toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/toolchain/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novavisor-toolchain:main
            ghcr.io/${{ github.repository_owner }}/novavisor-toolchain:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
