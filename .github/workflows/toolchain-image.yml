name: Toolchain Image

on:
  push:
    branches: ["main"]
    paths:
      - containers/toolchain/Dockerfile
      - scripts/bootstrap
      - scripts/tool-versions.env
      - .github/workflows/toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: containers/toolchain/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/novavisor-toolchain:main
            ghcr.io/${{ github.repository_owner }}/novavisor-toolchain:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # dependabot watches the Dockerfile's base image, not the digest its
      # consumers pin, so the publisher is the only place that knows the new
      # one. Report the exact edit; applying it stays a human decision, which
      # keeps this workflow's write access limited to the registry.
      - name: Report the consumer digest bump
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/novavisor-toolchain
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          consumers=$(grep -rl "${IMAGE}@sha256:" .github/workflows || true)
          if [[ -z "${consumers}" ]]; then
            echo "No workflow pins ${IMAGE} by digest." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # Word splitting is the point: every consumer is edited at once.
          # shellcheck disable=SC2086
          sed -i -E "s|(${IMAGE}@sha256:)[0-9a-f]{64}|\1${DIGEST#sha256:}|" ${consumers}
          {
            echo "## Toolchain image"
            echo
            echo "Published \`${DIGEST}\`."
            echo
            if git diff --quiet; then
              echo "Consumers already pin it."
            else
              echo "Apply this to move the consumers:"
              echo '```diff'
              git diff
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
