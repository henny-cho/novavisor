name: Recovery Soak

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Recovery attempts per target
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dma
            demo: "15"
            default-runs: "10"
            timeout: 45
            fetch: "false"
          - target: mixed
            demo: "14"
            default-runs: "5"
            timeout: 90
            fetch: "true"
    concurrency:
      group: soak-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/henny-cho/novavisor-toolchain@sha256:3f3b10be1424abf99b04d6d3a9fc0c8253252f750b3d8e1db4cadd9ac3609078
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      SOAK_DIR: build/soak-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/cache-build
        with:
          lane: soak-${{ matrix.target }}
          guests: ${{ matrix.fetch }}

      - name: Fetch external guest images
        if: matrix.fetch == 'true'
        run: scripts/nova demo fetch ${{ matrix.demo }}

      - name: Run recovery soak
        run: |
          scripts/nova demo soak ${{ matrix.demo }} \
            --runs "${{ inputs.runs || matrix.default-runs }}" \
            --summary "${SOAK_DIR}/summary.csv" \
            --artifacts "${SOAK_DIR}"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.target }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: build/soak-${{ matrix.target }}/
