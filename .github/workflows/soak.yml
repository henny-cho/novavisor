name: Recovery Soak

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Recovery attempts per target
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dma
            demo: "15"
            default-runs: "10"
            timeout: 45
          - target: mixed
            demo: "14"
            default-runs: "5"
            timeout: 90
    concurrency:
      group: soak-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/henny-cho/novavisor-toolchain@sha256:c2808b0aae9f4c64fb7b803fcd9eedd964cd806b89de1d38c4cc13b942f84c4e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      SOAK_DIR: build/soak-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/lane
        with:
          name: soak-${{ matrix.target }}

      # A demo without external images reports that and succeeds, so the
      # target list stays the only place a target is described.
      - name: Fetch external guest images
        run: scripts/nova demo fetch ${{ matrix.demo }}

      - name: Run recovery soak
        run: |
          scripts/nova demo soak ${{ matrix.demo }} \
            --runs "${{ inputs.runs || matrix.default-runs }}" \
            --summary "${SOAK_DIR}/summary.csv" \
            --artifacts "${SOAK_DIR}"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-${{ matrix.target }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ env.SOAK_DIR }}/
