name: NovaVisor Bare-Metal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to the same branch or PR supersedes the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-feedback lane: formatting + native GTest suite. Needs neither the
  # ARM toolchain nor QEMU, so it reports within a couple of minutes.
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cache CPM packages
        uses: actions/cache@v6
        with:
          path: external/cache
          # Dependency pins live in CMakeLists.txt AND cmake/ (get_cpm.cmake,
          # cib_cpm_pin.cmake), so both must key the cache.
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-

      - name: Install dependencies
        # The distro clang-format (v18 on noble) disagrees with the pinned
        # v20 on wrapping rules; install the pinned version via pipx.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build
          source scripts/lib/versions.sh
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        run: scripts/task.sh format --check

      - name: Host unit tests
        run: scripts/task.sh test

  # Cross lane: Release build, clang-tidy, and QEMU demo verification.
  target:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
    defaults:
      run:
        shell: bash
    # The mixed-criticality demo alone boots Linux twice under TCG.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-target
        with:
          guests: "true"
          firmware: "true"

      - name: Build (Release)
        run: scripts/task.sh build --release

      - name: Build minimal platform profile
        run: scripts/task.sh build --preset aarch64-minimal-release

      - name: Build standard platform profile
        run: scripts/task.sh build --preset aarch64-standard-release

      - name: Build N1SDP payload profile
        run: scripts/task.sh firmware smoke

      - name: QEMU TF-A chain smoke
        # Boots BL1 -> BL2 -> BL31 -> BL33 and matches five ordered
        # handoff markers. This used to compile the BL33 profile and stop
        # (--profile-only), which is why the gate could sit broken from
        # Phase 25e until Phase 26b noticed: a smoke that never executes
        # verifies nothing. ~30 s with the firmware cache warm.
        run: scripts/task.sh firmware qemu-smoke

      - name: Lint
        # run-clang-tidy over the debug tree's compile database; the debug
        # objects are reused by the demo step below.
        run: scripts/task.sh lint

      - name: Fetch external guest images
        # Idempotent: no-op on a guest-cache hit, source build on a miss
        # (the workspaces themselves are disposable and never cached).
        # The demo list is derived from the manifests (enabled + fetch.sh).
        run: scripts/task.sh demo fetch --all

      - name: Demo verification (enabled demos only)
        # Each completed phase flips its demo's `enabled` flag to true,
        # making this step the phase's acceptance gate.
        run: scripts/task.sh demo verify-all --artifacts build/demo-failures

      - name: Demo verification (standard profile)
        # The composition real-board bring-up runs before its IOMMU is
        # characterized. Compiling it is not enough — these four cover
        # what it adds over minimal (lifecycle/watchdog, physical SMP,
        # guest SMP, vuart/console mux) and are the fast ones, so the
        # tier is exercised without re-running the OS boots.
        env:
          NOVA_HV_PRESET: aarch64-standard-release
        run: |
          for id in 7 8 9 10; do
            scripts/task.sh demo verify "$id" --artifacts build/demo-failures
          done

      - name: Upload demo artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-artifacts
          path: |
            build/demo-failures/
            build/qemu-tfa-firmware/smoke.log
            build/demo/**/*.bin
            build/demo/**/*.elf
            build/aarch64-debug/novavisor.elf
            build/aarch64-debug/active_config.yml
            build/aarch64-debug/active_payloads.yml
            build/aarch64-debug/guest_dtb/*.dtb
            build/aarch64-n1sdp-release/novavisor.elf
            build/aarch64-n1sdp-release/active_payloads.yml
          if-no-files-found: ignore

  # Aggregate gate: one stable status-check name for branch protection,
  # independent of how the jobs above are split or renamed.
  ci:
    if: always()
    needs: [host, target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        run: |
          test "${{ needs.host.result }}" = "success"
          test "${{ needs.target.result }}" = "success"
