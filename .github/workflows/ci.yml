name: NovaVisor Bare-Metal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every lane runs in the toolchain image, so the pinned versions in
  # novakit/tool-versions.env reach CI through exactly one path.
  lane:
    name: lane (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: host
            timeout: 15
          - lane: static
            timeout: 20
          - lane: runtime
            timeout: 40
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/henny-cho/novavisor-toolchain@sha256:df411e49c264e5bc41f807ec9145ebc3c8a83acc2865b2bc0b6a3a9da7485c3c
      # An observed run backs guest RAM with a file the reader mmaps, and
      # keeping it on tmpfs is what keeps those pages off the disk. The
      # default 64 MiB holds a small guest and not a Linux one, and the
      # runner has 16 GiB to lend.
      options: --shm-size=2g
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/lane
        with:
          name: ${{ matrix.lane }}

      - name: Run ${{ matrix.lane }} lane
        run: ./nova ci ${{ matrix.lane }}

      # The lane collects its own evidence, so this names one directory
      # instead of a build-tree layout that rots when the harness moves.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-evidence
          path: build/ci-evidence/
          retention-days: 7
          if-no-files-found: ignore

  # One required check that stays correct when a lane is added: a matrix
  # result is "success" only when every leg succeeded.
  ci:
    if: always()
    needs: [lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      LANES: ${{ needs.lane.result }}
    steps:
      - name: Verify every lane passed
        run: test "${LANES}" = "success"
