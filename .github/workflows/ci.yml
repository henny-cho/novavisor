name: NovaVisor Bare-Metal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache CPM packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: external/cache/cpm
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: cpm-

      - name: Install formatter
        run: |
          source scripts/tool-versions.env
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Run host lane
        run: scripts/nova ci host

  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: static
            guests: "false"
            firmware: "false"
            timeout: 20
          - lane: runtime
            guests: "true"
            firmware: "true"
            timeout: 40
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/henny-cho/novavisor-toolchain@sha256:3f3b10be1424abf99b04d6d3a9fc0c8253252f750b3d8e1db4cadd9ac3609078
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/cache-build
        with:
          lane: ${{ matrix.lane }}
          guests: ${{ matrix.guests }}
          firmware: ${{ matrix.firmware }}

      - name: Run ${{ matrix.lane }} lane
        run: scripts/nova ci ${{ matrix.lane }}

      # The lane collects its own evidence, so this names one directory
      # instead of a build-tree layout that rots when the harness moves.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.lane }}-evidence
          path: build/ci-evidence/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    if: always()
    needs: [host, target]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        run: |
          test "${{ needs.host.result }}" = "success"
          test "${{ needs.target.result }}" = "success"
