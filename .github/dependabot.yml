# Dependabot keeps the shared toolchain image and workflow actions current.

version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/containers/toolchain"
    schedule:
      interval: weekly

  # Keeps the actions used by .github/workflows/ current (e.g. Node runtime
  # deprecations surface as major-version bumps).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
