<!doctype html>
<!-- Dark is the workbench default; main.mjs swaps this attribute when a
     stored preference says otherwise, so the palette is never wrong for
     more than the first paint. -->
<html lang="ko" data-nv-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaVisor Workbench</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/workbench.css">
</head>
<body>

<!-- Thin client: every string below is either static UI copy or filled in
     from a bridge frame. The document ships the skeleton only. -->
<div class="app">
  <header class="top">
    <div class="brand"><span class="nv">NOVA<i>VISOR</i></span><span class="sub">Workbench</span></div>

    <div class="launch">
      <label class="lb" for="target">타깃</label>
      <select id="target" class="pick" aria-label="실행할 데모 선택"></select>
      <button id="run" class="btn primary" type="button">실행</button>
      <button id="rerun" class="btn" type="button" hidden>재실행</button>
      <button id="pause" class="btn" type="button" hidden
              title="머신 정지 + sysreg 정밀 검사 (가상 클록도 함께 멈춤)">일시정지</button>
    </div>

    <!-- Stopping at an event, not wherever the reader happened to click.
         The choices arrive in the topo snapshot; nothing here names a
         firmware function. -->
    <div class="stepper">
      <label class="lb" for="stop-at">정지 지점</label>
      <select id="stop-at" class="pick" aria-label="어느 사건에서 멈출지"></select>
      <button id="advance" class="btn" type="button"
              title="선택한 사건까지 실행하고 멈춘다">다음 사건</button>
      <button id="step" class="btn" type="button"
              title="명령 단위로 진행 — 사건 '안'을 보기 위한 것">40 명령</button>
      <button id="auto" class="btn" type="button" aria-pressed="false"
              title="사건에서 사건으로 자동 진행 (진행 단위는 시간이 아니라 사건)">자동</button>
      <button id="abort" class="btn ghost" type="button" hidden
              title="진행 중단">중지</button>
      <span id="stop-note" class="badge sm" data-tone="idle" hidden></span>
    </div>

    <div class="status">
      <span id="phase" class="badge" data-tone="idle" title="세션 상태" aria-live="polite">
        <i class="dot"></i><span id="phase-text">대기</span>
      </span>
      <span id="boot" class="badge sm" data-tone="live" hidden>부팅 완료</span>
      <span id="conn" class="badge" data-tone="busy" title="브리지 연결 상태">
        <i class="dot"></i><span id="conn-text">연결 중</span>
      </span>
      <button id="loss" class="badge loss" type="button" hidden
              title="수신하지 못한 프레임 수 — 클릭하면 초기화">유실 <b id="loss-n">0</b></button>
    </div>

    <div class="clock" id="clock" title="세션 클록 (브리지 기준)">0.0s</div>
    <button id="theme" class="btn ghost" type="button" aria-pressed="true"
            title="라이트/다크 테마 전환">☀ Light</button>
  </header>

  <div class="main">
    <aside class="rail">
      <div class="pane-h">토폴로지</div>
      <div class="rail-body" id="topo"></div>
    </aside>

    <section class="center">

      <!-- The board shares the centre column with the console rather than
           replacing it: the console is the evidence source behind several
           of the things the board draws, so they have to be readable at
           the same time. -->
      <div class="view" id="view">
        <div class="view-h">
          <div class="view-title"><span>System map</span><strong id="view-name">실행 보드</strong></div>
          <div class="vtabs" role="tablist" aria-label="뷰 전환">
            <button class="vtab" id="vtab-board" role="tab" aria-selected="true" type="button"
                    data-view="board">보드</button>
            <button class="vtab" role="tab" aria-selected="false" type="button" disabled
                    title="인터럽트 경로 뷰는 아직 없습니다">인터럽트</button>
            <button class="vtab" id="vtab-memory" role="tab" aria-selected="false" type="button"
                    data-view="memory"
                    title="주소 번역 — 실제 페이지 테이블을 걸어서">메모리</button>
          </div>
          <!-- Always visible: the board is sparser than a simulator on
               purpose, and this says why. -->
          <div class="legend" aria-label="증거 등급">
            <span class="legend-label">EVIDENCE</span>
            <span class="lg" title="콘솔 이벤트 — 시각 정확"><i></i><b>C</b><span class="lg-copy">콘솔</span></span>
            <span class="lg" title="스냅샷 폴링 — 틱에 양자화된 관측"><i class="poll"></i><b>S</b><span class="lg-copy">폴링</span></span>
            <span class="lg" title="이 경로에서 머신을 세울 수 있다 — 표본이 아니라 사건 그 자체"><i class="direct"></i><b>M</b><span class="lg-copy">실측</span></span>
            <span class="lg" title="일시정지 시점의 확정값"><i class="lock">◆</i><b>H</b><span class="lg-copy">정지</span></span>
            <span class="lg" title="증거원 없음 — 구조만 표시"><i class="none"></i><b>—</b><span class="lg-copy">미관측</span></span>
          </div>
          <!-- Lives in the header, not the body: folding the whole view
               would hide the control that unfolds it. -->
          <button class="mini" id="fold" type="button" aria-expanded="true"
                  title="보드 접기 / 펼치기">접기</button>
        </div>
        <div class="board" id="board">
          <div class="bands" id="bands"><svg class="wires" id="wires" aria-hidden="true"></svg></div>
        </div>
        <!-- The other half of the same slot: the board draws what the
             machine is, this draws what an address means on it. One at a
             time, since both want the whole width. -->
        <div class="mmap" id="mmap" hidden>
          <div class="mmap-h">
            <div class="mmap-pick" id="mmap-pick" role="group" aria-label="번역 체계"></div>
            <form class="mmap-probe" id="mmap-probe" autocomplete="off">
              <!-- The placeholder comes from this run's own map: an
                   address typed here would be a guess. -->
              <input id="mmap-at" type="text" spellcheck="false" aria-label="따라갈 주소">
              <button class="btn" type="submit"
                      title="이 주소를 테이블을 따라 번역한다">따라가기</button>
            </form>
            <span class="mmap-note" id="mmap-note" aria-live="polite"></span>
          </div>
          <div class="mmap-body" id="mmap-body"></div>
        </div>
        <!-- Inside the view, so its height comes out of the board's
             share: the console already negotiates for the rest of the
             column and a third claimant would leave nobody able to
             state what the total is. -->
        <div class="tl" id="tl">
          <div class="tl-h">
            <span class="tl-title">시간 축</span>
            <span class="tl-note" id="tl-note">트레이스 대기</span>
            <!-- What the run holds and what the reader picked are two
                 different facts, and one label for both meant the next
                 drain erased the selection. -->
            <span class="tl-sel" id="tl-sel"></span>
            <button class="mini" id="tl-stop" type="button" hidden>여기서 멈추기</button>
            <!-- One selection, moved three ways. These push the same
                 cursor the arrow keys and a click push, so a tour is
                 the selection advancing rather than a second path. -->
            <button class="mini" id="tl-prev" type="button"
                    title="이전 사건 (←)">◀</button>
            <button class="mini" id="tl-play" type="button" aria-pressed="false"
                    title="녹화된 순서대로 재생 (Space) — 순서는 정확하고 유휴만 압축된다">재생</button>
            <button class="mini" id="tl-next" type="button"
                    title="다음 사건 (→)">▶</button>
            <button class="mini" id="tl-follow" type="button" aria-pressed="true"
                    title="최신 구간 추종">추종</button>
            <button class="mini" id="tl-fold" type="button" aria-expanded="true"
                    title="시간 축 접기 / 펼치기">접기</button>
          </div>
          <canvas class="tl-c" id="tl-canvas" aria-label="트레이스 시간 축"></canvas>
        </div>
      </div>

      <div class="split" id="split" role="separator" aria-orientation="horizontal"
           aria-label="보드와 콘솔 크기 조절" tabindex="0"
           title="드래그 또는 화살표 키로 조절"></div>

      <div class="pane-h">콘솔<div class="tabs" id="tabs" role="tablist" aria-label="콘솔 탭"></div></div>
      <div class="banner" id="banner" hidden></div>
      <div class="logs" id="logs"></div>
      <form class="cin" id="cin" autocomplete="off">
        <input id="cin-text" type="text" aria-label="UART 입력"
               placeholder="게스트로 보낼 입력 — Enter 전송 · 포커스 전환은 Ctrl-T 버튼">
        <button class="btn" type="submit">전송</button>
        <button class="btn" id="cin-focus" type="button" title="포커스 VM 전환 (0x14)">Ctrl-T</button>
      </form>
    </section>

    <aside class="side">
      <section class="pane">
        <div class="pane-h">VM 카드</div>
        <div class="cards" id="cards"></div>
      </section>
      <section class="pane">
        <!-- A group of toggles, not a tablist: more than one panel may be
             open at a time, which single-selection semantics cannot state. -->
        <div class="pane-h">패널<div class="tabs wrap" id="panel-tabs" role="group" aria-label="실측 패널"></div></div>
        <div class="panels" id="panels"></div>
      </section>
      <!-- The only controls in this workbench that act on the machine
           rather than observe it. Hidden until a run says it accepts
           them: a firmware without the ring cannot be driven, and a
           button that quietly does nothing is what this replaces. -->
      <section class="pane">
        <div class="pane-h">조작<span class="spacer"></span>
          <span class="dnote" id="drive-note" aria-live="polite"></span>
        </div>
        <div class="drive" id="drive" hidden></div>
      </section>
      <section class="pane">
        <div class="pane-h">이벤트 로그<span class="spacer"></span>
          <button class="mini" id="ev-all" type="button" title="모든 배지 다시 표시">전체</button>
          <button class="mini" id="ev-clear" type="button" title="표시된 행 삭제">비우기</button>
        </div>
        <div class="filters" id="filters" role="group" aria-label="배지 필터"></div>
        <div class="elog" id="elog" aria-live="polite"></div>
      </section>
    </aside>
  </div>
</div>

<script type="module" src="js/main.mjs"></script>
</body>
</html>
