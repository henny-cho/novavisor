name: "12_zephyr"
description: "Pinned Zephyr emits a low-rate heartbeat as a guest, validating sustained real-OS execution without flooding CI logs."
phase: 16
enabled: true
timeout_seconds: 60

config: "configs/zephyr.yml"

# External image: fetch.sh builds the pinned Zephyr release into
# external/cache/guests/12_zephyr/ (run `scripts/nova demo fetch 12` once).
# RAM placement comes from novavisor.overlay, so link base == slot 0.
guests:
  - name: "zephyr"
    binary: "zephyr.bin"
    load_addr:   0x50000000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00800000
    vcpus: 1
    uart: vuart

# A guest that never exits is the only place a stream stands still long
# enough to be stopped and started on purpose, so this demo runs twice:
# once as the heartbeat it has always been, and once with a stream of
# its own for the power commands to move.
variants:
  - name: "heartbeat"
    config: "configs/zephyr.yml"
    steps:
      - pattern: "Booting Zephyr OS build"
        within_seconds: 30
      - pattern: "NOVA ZEPHYR HEARTBEAT 1"
        within_seconds: 10
      - pattern: "NOVA ZEPHYR HEARTBEAT 2"
        within_seconds: 10
      - pattern: "NOVA ZEPHYR HEARTBEAT 3"
        within_seconds: 10

  - name: "dma"
    config: "configs/zephyr-dma.yml"
    qemu_devices:
      - "edu,bus=pcie.0,addr=2.0,dma_mask=0xffffffffff"
    steps:
      - pattern: "NOVA ZEPHYR HEARTBEAT 1"
        within_seconds: 40
      # The guest is up and nothing has faulted, so the stream is bound
      # to its VM's tables — the state a stop has to take it out of.
      - observe: "smmu.stream"
        where: { stream: 16 }
        equals: { state: "translate" }
        within_seconds: 5
      # The guest's own Stage 1 geometry, read while it runs: a 4 KiB
      # granule over 32 bits, with the high half switched off. This guest
      # is alone on its core and so never switches out, so a bank only
      # switch-out wrote would still read as the reset value here — and
      # no address of this guest's could be translated at all.
      - observe: "ctx.el1"
        equals: { "el1.tcr": "0x80803520" }
        within_seconds: 10
      - command: "stop 0"
        within_seconds: 10
      # No fault happened, so EL2's own recovery never ran: the only
      # thing that could have moved this entry is the command above.
      - observe: "smmu.stream"
        where: { stream: 16 }
        equals: { state: "abort" }
        within_seconds: 10
      - command: "start 0"
        within_seconds: 10
      - event: "smmu.attach"
        where: { stream: 16 }
        within_seconds: 15
      - observe: "smmu.stream"
        where: { stream: 16 }
        equals: { state: "translate" }
        within_seconds: 10
