name: "05_preempt"
description: "Time-slice preemption + wfi blocking: a non-cooperative busy guest and a wfi-driven ticker share one core."
phase: 9
enabled: true
timeout_seconds: 45

guests:
  - name: "busy"
    binary: "busy.bin"
    load_addr:   0x50000000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00100000
    vcpus: 1
  - name: "sleeper"
    binary: "sleeper.bin"
    load_addr:   0x50200000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00100000
    vcpus: 1

# Both guests schedule off the same virtual clock, so this order is
# deterministic: sleeper tick 2 (0.8 s) precedes busy done (1.0 s) only
# under preemption; ticks 3-5 (through 2.0 s) need wake-from-EL2-idle.
# The budgets below are wall clock and pure slack over that schedule —
# wide because an observed run maps its guest RAM through a file, which
# costs the guest time without moving any of the moments being ordered.
steps:
  - pattern: "wfi tick 2"
    within_seconds: 25
  - pattern: "preempt: busy done"
    within_seconds: 25
  # Print order is what makes the two lines above evidence for
  # preemption. These two are the mechanism, in the order the ring holds
  # them: the scheduler's own slot came due, and a switch followed. The
  # busy guest never yields and never waits, so nothing but that slot can
  # take the core from it — but a step finds the first match after the
  # last, so this is a sequence and not an adjacency.
  #
  # The switch names both ends, so which way it went is asserted too:
  # off the busy guest (slot 0) and onto the sleeper (slot 2). Its width
  # is not — that is how long busy held the core, which is however long
  # the sleeper's wfi lasted.
  - event: "timer.late"
    where: { slot: 0 }
    within_seconds: 5
  - event: "sched.switch"
    where: { next: 2, prev: 0 }
    within_seconds: 5
  - pattern: "preempt: wfi done"
    within_seconds: 25
  - pattern: "demo_exit code=0"
    within_seconds: 20
