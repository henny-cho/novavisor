name: "15_dma_isolation"
description: "A guest-owned PCI stream is quarantined, reattached, faulted at runtime, and recovered by generation."
phase: 19
enabled: true
timeout_seconds: 20

config: "configs/dma.yml"
qemu_devices:
  - "edu,bus=pcie.0,addr=2.0,dma_mask=0xffffffffff"

forbid:
  - "\\[dma\\] runtime fault request failed"
  - "\\[smp\\] DMA fault in VM 0 sid 16 generation 4"
  - "\\[dma\\] VM 0 resumed generation 5"

guests:
  - name: "dma_isolation"
    binary: "dma_isolation.bin"
    load_addr:   0x50000000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00100000
    vcpus: 1

steps:
  - pattern: "\\[dma\\] EDU round-trip ok"
    within_seconds: 10
  - pattern: "\\[smmu\\] fault type=0x0*10 sid=16 iova=0x0*50100000"
    within_seconds: 5
  - pattern: "\\[dma\\] EDU isolation probe passed"
    within_seconds: 5
  - pattern: "dma lifecycle boot 1"
    within_seconds: 5
  - pattern: "\\[dma\\] VM 0 resumed generation 3"
    within_seconds: 5
  - pattern: "dma lifecycle boot 2"
    within_seconds: 5
  - pattern: "\\[dma\\] runtime fault requested"
    within_seconds: 5
  - pattern: "\\[smmu\\] fault type=0x0*10 sid=16 iova=0x0*50100000"
    within_seconds: 5
  - pattern: "\\[smp\\] DMA fault in VM 0 sid 16 generation 3"
    within_seconds: 5
  - pattern: "\\[dma\\] VM 0 resumed generation 4"
    within_seconds: 5
  # The fault first, so the re-attach below is anchored after it. Without
  # that anchor the step would be satisfied by the attach at boot, and
  # would assert nothing about recovery at all.
  - event: "smmu.fault"
    where: { stream: 16 }
    within_seconds: 5
  # What the resume line claims, read off the ring. The record carries
  # the Stage-2 root the stream was bound to, so a stream that came back
  # attached to nothing would not satisfy this.
  - event: "smmu.attach"
    where: { stream: 16 }
    within_seconds: 5
  - pattern: "dma lifecycle boot 3"
    within_seconds: 5
  - pattern: "demo_exit code=0"
    within_seconds: 5
  - pattern: "\\[dma\\] VM 0 quiesced"
    within_seconds: 5
  - pattern: "\\[smp\\] VM 0 stopped"
    within_seconds: 5
  # Nothing re-attaches after the last VM stops, so this is the one
  # window in the run where the entry stays still long enough to be
  # read for what it is rather than for whichever side of a transition
  # the sample landed on.
  - observe: "smmu.stream"
    where: { stream: 16 }
    equals: { state: "abort" }
    within_seconds: 5
