name: "03_ivc_pingpong"
description: "Two VMs ping-pong 1000 rounds over the IVC shared page with doorbell vIRQs."
phase: 7
enabled: true
# Budgets are wall clock, and a run with an observation step carries its
# guest RAM in a file the reader maps rather than in anonymous memory —
# which costs the guest time on a slow host. The rounds themselves are
# the guests' own work and unchanged.
timeout_seconds: 30

guests:
  - name: "ping"
    binary: "ping.bin"
    # load_addr = PA slot 0 (identity with NOVA_GUEST_IPA_BASE); both
    # guests link at the same IPA — Stage 2 separates them by slot.
    load_addr:   0x50000000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00100000
    vcpus: 1
  - name: "pong"
    binary: "pong.bin"
    # load_addr = PA slot 1 = NOVA_GUEST_IPA_BASE + NOVA_GUEST_PA_STRIDE.
    load_addr:   0x50200000
    ipa_base:    0x50000000
    entry:       0x50000000
    memory_size: 0x00100000
    vcpus: 1

steps:
  - pattern: "pingpong: 1000 rounds ok"
    within_seconds: 20
  # The rounds are the guests' own count. This is the hypervisor's half
  # of one: a doorbell hypercall from the other VM, turned into an SGI
  # for this one.
  - event: "ivc.doorbell"
    where: { vm: 1 }
    within_seconds: 5
  - pattern: "demo_exit code=0"
    within_seconds: 10
